<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="t d">
  <title id="t">Deck 8 slides minimum</title>
  <desc id="d">Carte minimale de 8 slides pour le pitch capstone.</desc>
  <rect width="960" height="240" fill="#F8FAFC"/>
  
  <text x="480" y="36" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#0F172A">Minimum capstone : 8 slides</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700">
    <rect x="40" y="70" width="100" height="70" rx="8" fill="#CCFBF1"/><text x="90" y="110" text-anchor="middle">1 Accroche</text>
    <rect x="155" y="70" width="100" height="70" rx="8" fill="#CCFBF1"/><text x="205" y="110" text-anchor="middle">2 Enjeu</text>
    <rect x="270" y="70" width="100" height="70" rx="8" fill="#CCFBF1"/><text x="320" y="110" text-anchor="middle">3 Public</text>
    <rect x="385" y="70" width="100" height="70" rx="8" fill="#FEF3C7"/><text x="435" y="110" text-anchor="middle">4 Solution</text>
    <rect x="500" y="70" width="100" height="70" rx="8" fill="#FEF3C7"/><text x="550" y="110" text-anchor="middle">5 Comment</text>
    <rect x="615" y="70" width="100" height="70" rx="8" fill="#DBEAFE"/><text x="665" y="110" text-anchor="middle">6 Preuve</text>
    <rect x="730" y="70" width="100" height="70" rx="8" fill="#DBEAFE"/><text x="780" y="110" text-anchor="middle">7 Chiffres</text>
    <rect x="845" y="70" width="90" height="70" rx="8" fill="#FCE7F3"/><text x="890" y="110" text-anchor="middle">8 Demande</text>
  </g>
  <text x="480" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#334155">Bonus : jusqu a 12 slides + notes + Excel annexe</text>

  <text x="480" y="224" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748B">Deck 8 slides minimum</text>
</svg>
