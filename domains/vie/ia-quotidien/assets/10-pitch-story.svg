<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
  <title id="t">Récit du pitch</title>
  <desc id="d">Arc narratif probleme enjeu solution preuve demande avant d ouvrir PowerPoint.</desc>

  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">L'histoire avant les slides</text>
  <text x="56" y="82" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Inspiré de Duarte (Resonate) — tension présent → futur désirable</text>

  <rect x="48" y="180" width="210" height="240" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <circle cx="153" cy="240" r="28" fill="#B91C1C"/>
  <text x="153" y="248" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#fff">1</text>
  <text x="153" y="320" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Problème</text>
  <text x="153" y="355" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">Douleur vécue</text><path d="M258 300 H276" stroke="#94A3B8" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="276" y="220" width="210" height="240" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <circle cx="381" cy="280" r="28" fill="#F59E0B"/>
  <text x="381" y="288" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">2</text>
  <text x="381" y="360" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Enjeu</text>
  <text x="381" y="395" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">Pourquoi maintenant</text><path d="M486 340 H504" stroke="#94A3B8" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="504" y="180" width="210" height="240" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <circle cx="609" cy="240" r="28" fill="#16A34A"/>
  <text x="609" y="248" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#fff">3</text>
  <text x="609" y="320" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Solution</text>
  <text x="609" y="355" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">Promesse claire</text><path d="M714 300 H732" stroke="#94A3B8" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="732" y="220" width="210" height="240" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <circle cx="837" cy="280" r="28" fill="#0284C7"/>
  <text x="837" y="288" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#fff">4</text>
  <text x="837" y="360" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Preuve</text>
  <text x="837" y="395" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">Chiffres fictifs OK</text><path d="M942 340 H960" stroke="#94A3B8" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="960" y="180" width="210" height="240" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <circle cx="1065" cy="240" r="28" fill="#7C3AED"/>
  <text x="1065" y="248" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#fff">5</text>
  <text x="1065" y="320" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Demande</text>
  <text x="1065" y="355" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">Ce que tu veux</text>
  <rect x="48" y="500" width="1104" height="100" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="600" y="545" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#115E59">Valide l'outline (titres seuls) AVANT d'ouvrir PowerPoint</text>
  <text x="600" y="575" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Capstone minimum : 8 slides d'histoire · Bonus : 10–12</text>
  <text x="600" y="660" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Récit du pitch · ia-quotidien</text>
</svg>
