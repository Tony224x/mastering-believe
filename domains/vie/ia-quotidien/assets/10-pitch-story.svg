<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280">
  <rect width="960" height="280" fill="#F8FAFC"/>
  <text x="480" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Recit du pitch (avant les slides)</text>
  <!-- wave-ish steps -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="50" y="160" width="140" height="60" rx="10" fill="#FEE2E2" stroke="#B91C1C"/>
    <text x="120" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#7F1D1D">Probleme</text>
    <rect x="220" y="120" width="140" height="60" rx="10" fill="#FFEDD5" stroke="#C2410C"/>
    <text x="290" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#7C2D12">Enjeu</text>
    <rect x="390" y="80" width="140" height="60" rx="10" fill="#D1FAE5" stroke="#047857"/>
    <text x="460" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#064E3B">Solution</text>
    <rect x="560" y="100" width="140" height="60" rx="10" fill="#DBEAFE" stroke="#1D4ED8"/>
    <text x="630" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">Preuve</text>
    <rect x="730" y="70" width="170" height="60" rx="10" fill="#EDE9FE" stroke="#6D28D9"/>
    <text x="815" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#4C1D95">Demande finale</text>
  </g>
  <path d="M190 190 H220 M360 150 H390 M530 110 H560 M700 130 H730" stroke="#94A3B8" stroke-width="2"/>
  <text x="480" y="255" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#64748B">Inspire de Duarte (Resonate) — une idee par slide ensuite</text>
</svg>
