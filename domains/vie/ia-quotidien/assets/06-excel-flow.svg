  <text x="837" y="360" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">Total = manuel ?</text>
<rect x="960" y="160" width="210" height="280" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <circle cx="1065" cy="240" r="32" fill="#DC2626"/>
