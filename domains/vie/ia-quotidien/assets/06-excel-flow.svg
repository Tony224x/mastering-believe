  <text x="56" y="82" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Si erreur → renvoyer le message (#NOM?, #DIV/0!) au chat</text>
