  <text x="600" y="565" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">Entrées 600 · Sorties 150 · Solde 450 · Formule type =SOMME.SI(D2:D7;"entrée";C2:C7)</text>

