<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Checklist V-A-I-R</title>
  <desc id="d">Quatre questions avant d'utiliser une reponse IA : Verifiable, Ancree, Invention possible, Risque si faux.</desc>

  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="s2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="gSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDFA"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0F766E"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Avant d'utiliser une réponse</text>

  <text x="56" y="82" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Si un critère échoue → vérifier ou jeter</text>
<rect x="56" y="130" width="260" height="420" rx="18" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.5" filter="url(#s2)"/>
  <circle cx="186" cy="220" r="44" fill="#0F766E"/>
  <text x="186" y="232" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#fff">V</text>
  <text x="186" y="320" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">Vérifiable ?</text>
  <text x="186" y="360" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Source que tu peux</text>
  <text x="186" y="385" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">ouvrir toi-même</text>
  <text x="186" y="480" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0F766E">OUI / NON</text>
<rect x="336" y="130" width="260" height="420" rx="18" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.5" filter="url(#s2)"/>
  <circle cx="466" cy="220" r="44" fill="#0F766E"/>
  <text x="466" y="232" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#fff">A</text>
  <text x="466" y="320" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">Ancrée ?</text>
  <text x="466" y="360" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Dans TES faits</text>
  <text x="466" y="385" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">et ton contexte</text>
  <text x="466" y="480" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0F766E">OUI / NON</text>
<rect x="616" y="130" width="260" height="420" rx="18" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.5" filter="url(#s2)"/>
  <circle cx="746" cy="220" r="44" fill="#DC2626"/>
  <text x="746" y="232" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#fff">I</text>
  <text x="746" y="320" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">Invention ?</text>
  <text x="746" y="360" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">% trop ronds,</text>
  <text x="746" y="385" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">titres trop parfaits</text>
  <text x="746" y="480" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#DC2626">DOUTE ?</text>
<rect x="896" y="130" width="260" height="420" rx="18" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.5" filter="url(#s2)"/>
  <circle cx="1026" cy="220" r="44" fill="#DC2626"/>
  <text x="1026" y="232" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#fff">R</text>
  <text x="1026" y="320" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">Risque si faux ?</text>
  <text x="1026" y="360" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">École, travail,</text>
  <text x="1026" y="385" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">décision importante</text>
  <text x="1026" y="480" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#DC2626">ÉLEVÉ ?</text>
  <text x="600" y="660" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Checklist V-A-I-R · ia-quotidien</text>
</svg>
