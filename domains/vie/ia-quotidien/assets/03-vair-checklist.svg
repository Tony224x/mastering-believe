    <text x="370" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Ancree ?</text>
    <text x="370" y="210" text-anchor="middle" font-size="12" fill="#64748B">Dans TES faits</text>
    <rect x="500" y="80" width="200" height="180" rx="14" fill="#FFFFFF" stroke="#C2410C" stroke-width="3"/>
    <circle cx="600" cy="120" r="28" fill="#C2410C"/>
