<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320">
  <rect width="960" height="320" fill="#F8FAFC"/>
  <text x="480" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Checklist V-A-I-R avant d&#39;utiliser une reponse</text>
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="40" y="80" width="200" height="180" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/>
