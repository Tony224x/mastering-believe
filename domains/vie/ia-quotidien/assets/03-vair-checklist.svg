    <text x="140" y="128" text-anchor="middle" font-size="22" font-weight="700" fill="#FFF">V</text>
    <text x="140" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Verifiable ?</text>
    <text x="140" y="210" text-anchor="middle" font-size="12" fill="#64748B">Source ouvrable</text>
    <rect x="270" y="80" width="200" height="180" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/>
