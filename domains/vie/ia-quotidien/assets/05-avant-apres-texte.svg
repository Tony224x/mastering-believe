  <rect x="660" y="80" width="250" height="120" rx="12" fill="#D1FAE5"/><text x="785" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#064E3B">Ta version finale</text>

