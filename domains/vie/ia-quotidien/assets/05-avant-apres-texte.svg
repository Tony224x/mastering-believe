<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Écrire avec l'IA</title>
  <desc id="d">Pipeline notes brutes, plan et brouillon IA, puis reecriture humaine obligatoire.</desc>

  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="s2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="gSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDFA"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0F766E"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Notes → plan → réécriture</text>

  <text x="56" y="82" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">L'IA propose — toi tu assumes le livrable</text>
<rect x="80" y="150" width="340" height="380" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <rect x="80" y="150" width="340" height="70" rx="18" fill="#B91C1C"/>
  <rect x="80" y="200" width="340" height="20" fill="#B91C1C"/>
  <text x="250" y="195" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#fff">1 · Notes brutes</text>
  <text x="250" y="300" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">Tes puces</text>
  <text x="250" y="330" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">Ton énoncé</text>
  <text x="250" y="400" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Sans l'IA d'abord</text>
<rect x="450" y="150" width="340" height="380" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <rect x="450" y="150" width="340" height="70" rx="18" fill="#F59E0B"/>
  <rect x="450" y="200" width="340" height="20" fill="#F59E0B"/>
  <text x="620" y="195" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">2 · Plan + brouillon</text>
  <text x="620" y="300" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">Outline 5 parties</text>
  <text x="620" y="330" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">Une section rédigée</text>
  <text x="620" y="400" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Marqueur [À_VÉRIFIER]</text>
<rect x="820" y="150" width="340" height="380" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <rect x="820" y="150" width="340" height="70" rx="18" fill="#16A34A"/>
  <rect x="820" y="200" width="340" height="20" fill="#16A34A"/>
  <text x="990" y="195" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#fff">3 · Version finale</text>
  <text x="990" y="300" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">Réécriture ≥ 30 %</text>
  <text x="990" y="330" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">Tes mots</text>
  <text x="990" y="400" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Tu peux l'expliquer</text>
  <path d="M420 340 H450" stroke="#94A3B8" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M790 340 H820" stroke="#94A3B8" stroke-width="3" marker-end="url(#arr)"/>

  <text x="600" y="660" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Écrire avec l'IA · ia-quotidien</text>
</svg>
