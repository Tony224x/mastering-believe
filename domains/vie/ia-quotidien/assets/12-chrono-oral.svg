<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
  <title id="t">Chrono oral</title>
  <desc id="d">Ouverture courte, details hors slide, transition, filet de securite.</desc>
  <rect width="960" height="300" fill="#F8FAFC"/>
  
  <text x="480" y="40" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#0F172A">Notes orateur (pas lire la slide)</text>
  <rect x="40" y="90" width="200" height="100" rx="10" fill="#E0E7FF"/><text x="140" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700">Ouverture 10s</text>
  <rect x="270" y="90" width="200" height="100" rx="10" fill="#DBEAFE"/><text x="370" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700">2 details hors slide</text>
  <rect x="500" y="90" width="200" height="100" rx="10" fill="#CFFAFE"/><text x="600" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700">Transition</text>
  <rect x="730" y="90" width="190" height="100" rx="10" fill="#FCE7F3"/><text x="825" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700">Filet securite</text>

  <text x="480" y="284" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748B">Chrono oral</text>
