  <text x="255" y="400" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0F172A">D2:D7</text>
  <text x="255" y="450" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Où chercher</text>
  <text x="255" y="480" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">la condition</text>
<rect x="440" y="280" width="310" height="280" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <rect x="440" y="280" width="310" height="56" rx="18" fill="#F59E0B"/>
  <rect x="440" y="320" width="310" height="16" fill="#F59E0B"/>
  <text x="595" y="318" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">2 · Critère</text>
  <text x="595" y="400" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#0F172A">"entrée"</text>
  <text x="595" y="450" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Quoi matcher</text>
  <text x="595" y="480" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">(attention guillemets)</text>
<rect x="780" y="280" width="310" height="280" rx="18" fill="#FFFFFF" filter="url(#s)"/>
