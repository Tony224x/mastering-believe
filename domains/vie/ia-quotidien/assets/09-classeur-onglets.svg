<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Classeur Budget PME Demo</title>
  <desc id="d">Quatre onglets Transactions Resume Scenarios Readme pour le livrable Excel fictif.</desc>

  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="s2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="gSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDFA"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0F766E"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Budget-PME-Demo.xlsx</text>

  <text x="56" y="82" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">100 % fictif — zéro donnée réelle d'employeur</text>
<rect x="56" y="140" width="260" height="380" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <rect x="56" y="140" width="260" height="90" rx="18" fill="#0F766E"/>
  <rect x="56" y="210" width="260" height="20" fill="#0F766E"/>
  <text x="186" y="200" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#fff">Transactions</text>
  <text x="186" y="300" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">20–40 lignes</text>
  <text x="186" y="340" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">Date · Libellé · …</text>
  <text x="186" y="420" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">Données brutes</text>
<rect x="336" y="140" width="260" height="380" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <rect x="336" y="140" width="260" height="90" rx="18" fill="#0D9488"/>
  <rect x="336" y="210" width="260" height="20" fill="#0D9488"/>
  <text x="466" y="200" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#fff">Résumé</text>
  <text x="466" y="300" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">Totaux formules</text>
  <text x="466" y="340" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">Solde automatique</text>
  <text x="466" y="420" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">Pas de totaux tapés</text>
<rect x="616" y="140" width="260" height="380" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <rect x="616" y="140" width="260" height="90" rx="18" fill="#14B8A6"/>
  <rect x="616" y="210" width="260" height="20" fill="#14B8A6"/>
  <text x="746" y="200" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#115E59">Scénarios</text>
  <text x="746" y="300" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">Base / +10 %</text>
  <text x="746" y="340" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">Pessimiste −10 %</text>
  <text x="746" y="420" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">Formules liées</text>
<rect x="896" y="140" width="260" height="380" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <rect x="896" y="140" width="260" height="90" rx="18" fill="#99F6E4"/>
  <rect x="896" y="210" width="260" height="20" fill="#99F6E4"/>
  <text x="1026" y="200" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#115E59">Readme</text>
  <text x="1026" y="300" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">Hypothèses</text>
  <text x="1026" y="340" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">Rôle de l'IA</text>
  <text x="1026" y="420" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">Vérifs faites</text>
  <rect x="56" y="550" width="1088" height="80" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="600" y="598" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#115E59">Badge « Trésorier démo » quand les 4 onglets existent et le solde est calculé par formule</text>

  <text x="600" y="660" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Classeur Budget PME Demo · ia-quotidien</text>
