  <text x="600" y="198" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">mémoire locale</text>  <rect x="730" y="145" width="180" height="70" rx="18" fill="#FEE2E2" filter="url(#s)"/>
