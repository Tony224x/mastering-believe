  <text x="820" y="373" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">stateless</text>  <line x1="380" y1="390" x2="380" y2="440" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="600" y1="390" x2="600" y2="440" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="820" y1="390" x2="820" y2="440" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="400" y="450" width="400" height="70" rx="18" fill="#FEF3C7" filter="url(#s)"/>
