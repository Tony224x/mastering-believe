  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 25 · schéma détaillé</text>  <text x="600" y="125" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#DC2626">Anti-pattern : state dans le process</text>  <rect x="290" y="145" width="180" height="70" rx="18" fill="#FEE2E2" filter="url(#s)"/>
