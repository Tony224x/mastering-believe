  <text x="820" y="198" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">mémoire locale</text>  <text x="600" y="250" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">LB envoie la suite ailleurs → état perdu</text>  <text x="600" y="295" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F766E">Cible : workers stateless + checkpointer</text>  <rect x="290" y="320" width="180" height="70" rx="18" fill="#CCFBF1" filter="url(#s)"/>
