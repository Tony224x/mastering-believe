<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Harness pass^k</title>
  <desc id="d">Pipeline : cas de test → run × k → score → pass^k → rapport de régression vs baseline.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Harness d'évaluation sur TON agent</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Dataset · scorers · pass^k · rapport de régression</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 26 · agentic-ai</text>  <rect x="80" y="250" width="180" height="100" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="170" y="306" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Cas de test</text>  <line x1="260" y1="300" x2="300" y2="300" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="300" y="250" width="180" height="100" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="390" y="306" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Run × k</text>  <line x1="480" y1="300" x2="520" y2="300" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="520" y="250" width="180" height="100" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="610" y="306" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Score</text>  <line x1="700" y1="300" x2="740" y2="300" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="740" y="250" width="180" height="100" rx="18" fill="#0F766E" filter="url(#s)"/>
  <text x="830" y="306" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#fff">pass^k</text>  <line x1="920" y1="300" x2="960" y2="300" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="960" y="250" width="180" height="100" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="1050" y="306" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Rapport</text>  <rect x="200" y="420" width="800" height="140" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="600" y="480" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#0F172A">pass^k = proba de ≥1 succès sur k essais indépendants</text>
  <text x="600" y="520" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Compare toujours à une baseline figée — sinon tu ne vois pas les régressions</text>
</svg>
