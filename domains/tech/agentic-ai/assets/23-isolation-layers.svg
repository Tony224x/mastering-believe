<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Couches d'isolation sandbox</title>
  <desc id="d">Sept couches empilées de l'audit log jusqu'aux limites process.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Isolation : défense en profondeur infra</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">process → microVM → egress → audit</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 23 · schéma détaillé</text>  <rect x="180" y="110" width="840" height="54" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="600" y="143" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">L7  Audit log immuable</text>  <rect x="180" y="172" width="840" height="54" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="600" y="205" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">L6  Egress filtering</text>  <rect x="180" y="234" width="840" height="54" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="600" y="267" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">L5  Capability tools</text>  <rect x="180" y="296" width="840" height="54" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="600" y="329" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">L4  MicroVM / Firecracker</text>  <rect x="180" y="358" width="840" height="54" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="600" y="391" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">L3  gVisor / sandbox runtime</text>  <rect x="180" y="420" width="840" height="54" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="600" y="453" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">L2  Container / cgroups</text>  <rect x="180" y="482" width="840" height="54" rx="18" fill="#FEE2E2" filter="url(#s)"/>
  <text x="600" y="515" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#991B1B">L1  Process limits</text>
</svg>
