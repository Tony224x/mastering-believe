<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Capstone build eval</title>
  <desc id="d">Quatre étapes : build runnable, scénario bug→fix, crash test avec reprise, eval pass^k et rapport.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Capstone : build &amp; eval bout en bout</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Réparer un bug · reprendre après crash · prouver pass^k</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 28 · agentic-ai</text>  <rect x="100" y="240" width="220" height="120" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="210" y="296" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">1. Build</text>
  <text x="210" y="318" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">agent runnable</text>  <rect x="360" y="240" width="220" height="120" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="470" y="296" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">2. Scenario</text>
  <text x="470" y="318" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">bug → fix</text>  <rect x="620" y="240" width="220" height="120" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="730" y="296" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">3. Crash test</text>
  <text x="730" y="318" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">reprise durable</text>  <rect x="880" y="240" width="220" height="120" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="990" y="296" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">4. Eval</text>
  <text x="990" y="318" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">rapport final</text>  <line x1="320" y1="300" x2="360" y2="300" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="580" y1="300" x2="620" y2="300" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="840" y1="300" x2="880" y2="300" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="200" y="430" width="800" height="140" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="600" y="490" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Done = démonstration live + métriques, pas seulement le code</text>
  <text x="600" y="530" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Si tu ne peux pas rejouer et expliquer un échec : pas prêt</text>
</svg>
