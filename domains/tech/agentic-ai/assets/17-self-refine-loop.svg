<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Boucle Self-Refine verifier</title>
  <desc id="d">Generator, verifier, refiner, select, avec boucle de retry bornée et leçons optionnelles.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Self-Refine / verifier loop</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Generate → critique → refine → select</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 17 · schéma détaillé</text>  <rect x="100" y="220" width="200" height="100" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="200" y="266" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Generator</text>
  <text x="200" y="288" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">draft</text>  <line x1="300" y1="270" x2="345" y2="270" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="345" y="220" width="200" height="100" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="445" y="266" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">Verifier</text>
  <text x="445" y="288" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">ORM / PRM</text>  <line x1="545" y1="270" x2="590" y2="270" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="590" y="220" width="200" height="100" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="690" y="266" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Refiner</text>
  <text x="690" y="288" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">corrige</text>  <line x1="790" y1="270" x2="835" y2="270" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="835" y="220" width="200" height="100" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="935" y="266" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Select</text>
  <text x="935" y="288" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">best / accept</text>  <path d="M690 320 Q690 420 200 420 Q150 420 150 320" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrA)"/>
  <text x="420" y="450" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#F59E0B">retry borné</text>  <text x="600" y="520" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#0F172A">Option : persister les leçons entre runs</text>
</svg>
