<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Flux tool use</title>
  <desc id="d">Quatre étapes : définir le schéma d'outil, le LLM choisit nom et arguments, exécution, observation réinjectée pour la suite.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Tool use : le superpouvoir de l'agent</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Schéma d'outil → appel → résultat → nouvelle décision</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 02 · agentic-ai</text>  <rect x="80" y="220" width="200" height="140" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="180" y="286" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">1. Schéma</text>
  <text x="180" y="308" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">JSON du tool</text>  <rect x="80" y="220" width="200" height="8" rx="4" fill="#0F766E"/>  <rect x="320" y="220" width="200" height="140" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="420" y="286" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">2. LLM choisit</text>
  <text x="420" y="308" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">nom + args</text>  <rect x="320" y="220" width="200" height="8" rx="4" fill="#F59E0B"/>  <rect x="560" y="220" width="200" height="140" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="660" y="286" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">3. Exécution</text>
  <text x="660" y="308" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">code / API</text>  <rect x="560" y="220" width="200" height="8" rx="4" fill="#115E59"/>  <rect x="800" y="220" width="200" height="140" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="900" y="286" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">4. Observation</text>
  <text x="900" y="308" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">résultat injecté</text>  <rect x="800" y="220" width="200" height="8" rx="4" fill="#0F766E"/>  <line x1="280" y1="290" x2="320" y2="290" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="520" y1="290" x2="560" y2="290" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="760" y1="290" x2="800" y2="290" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="200" y="420" width="800" height="160" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="600" y="470" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0F172A">Règles d'or</text>
  <text x="240" y="510" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">• Description claire du tool (quand l'appeler)</text>
  <text x="240" y="540" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">• Arguments typés + validation · erreurs renvoyées au LLM (pas crash silencieux)</text>
  <text x="240" y="570" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">• Structured output = appels plus fiables qu'un free-text</text>
</svg>
