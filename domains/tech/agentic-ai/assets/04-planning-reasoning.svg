<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Patterns de planning</title>
  <desc id="d">Quatre patterns : CoT (une passe), ReAct (boucle outils), Plan-and-Execute (deux phases), ToT/Reflexion (plus cher). Commencer simple.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Planning &amp; reasoning : choisir le bon pattern</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Du simple (CoT) au coûteux (ToT / multi-critique)</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 04 · agentic-ai</text>  <rect x="100" y="180" width="200" height="280" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <rect x="100" y="180" width="200" height="10" fill="#0F766E"/>
  <text x="200" y="240" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">CoT</text>  <text x="200" y="290" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Chaîne de</text>  <text x="200" y="318" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">raisonnement</text>  <rect x="140" y="380" width="120" height="36" rx="18" fill="#0F766E"/>
  <text x="200" y="403" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#fff">1 passe</text>  <rect x="320" y="180" width="200" height="280" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <rect x="320" y="180" width="200" height="10" fill="#0F766E"/>
  <text x="420" y="240" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">ReAct</text>  <text x="420" y="290" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Raisonner +</text>  <text x="420" y="318" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">outils en boucle</text>  <rect x="360" y="380" width="120" height="36" rx="18" fill="#0F766E"/>
  <text x="420" y="403" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#fff">itératif</text>  <rect x="540" y="180" width="200" height="280" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <rect x="540" y="180" width="200" height="10" fill="#F59E0B"/>
  <text x="640" y="240" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">Plan→Exec</text>  <text x="640" y="290" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Plan d'abord,</text>  <text x="640" y="318" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">puis exécuter</text>  <rect x="580" y="380" width="120" height="36" rx="18" fill="#F59E0B"/>
  <text x="640" y="403" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#fff">2 phases</text>  <rect x="760" y="180" width="200" height="280" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <rect x="760" y="180" width="200" height="10" fill="#DC2626"/>
  <text x="860" y="240" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">ToT / Reflexion</text>  <text x="860" y="290" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Arbre / critique</text>  <text x="860" y="318" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">de soi</text>  <rect x="800" y="380" width="120" height="36" rx="18" fill="#DC2626"/>
  <text x="860" y="403" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#fff">cher</text>  <text x="600" y="540" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#0F172A">Règle : commence simple. Monte en complexité seulement si la tâche le exige.</text>
  <text x="600" y="580" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Plus de raisonnement ≠ toujours mieux — tokens, latence, et overthinking</text>
</svg>
