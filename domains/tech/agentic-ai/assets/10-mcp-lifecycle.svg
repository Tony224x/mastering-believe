<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Lifecycle connexion MCP</title>
  <desc id="d">Quatre étapes : launch, initialize, list des capacités, call d'outil avec résultat.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Cycle de vie d'une connexion MCP</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Du lancement subprocess à l'appel d'outil</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 10 · schéma détaillé</text>  <rect x="125" y="200" width="200" height="110" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="225" y="251" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">1 · Launch</text>
  <text x="225" y="273" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">host démarre server</text>  <line x1="325" y1="255" x2="375" y2="255" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="375" y="200" width="200" height="110" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="475" y="251" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">2 · Initialize</text>
  <text x="475" y="273" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">handshake JSON-RPC</text>  <line x1="575" y1="255" x2="625" y2="255" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="625" y="200" width="200" height="110" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="725" y="251" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">3 · List</text>
  <text x="725" y="273" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">tools / resources</text>  <line x1="825" y1="255" x2="875" y2="255" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="875" y="200" width="200" height="110" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="975" y="251" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">4 · Call</text>
  <text x="975" y="273" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">tools/call + result</text>  <rect x="150" y="370" width="900" height="140" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="600" y="420" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#0F172A">Transport : stdio local ou HTTP distant</text>
  <text x="600" y="455" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">Découvrir les capacités avant d'invoquer</text>
  <text x="600" y="485" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0F766E">HITL sur tools sensibles</text>
</svg>
