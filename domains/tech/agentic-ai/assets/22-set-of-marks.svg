<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Set-of-Marks prompting</title>
  <desc id="d">Comparaison screenshot brut versus éléments numérotés pour guider les actions du LLM.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Set-of-Marks (SoM)</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Numéroter les éléments cliquables pour le LLM</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 22 · schéma détaillé</text>  <rect x="80" y="140" width="480" height="340" rx="18" fill="#FFFFFF" filter="url(#s)"/>  <text x="320" y="180" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#64748B">Screenshot brut</text>  <rect x="140" y="220" width="360" height="50" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="320" y="251" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Username</text>  <rect x="140" y="290" width="360" height="50" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="320" y="321" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Password</text>  <rect x="140" y="360" width="160" height="50" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="220" y="391" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Submit</text>  <rect x="340" y="360" width="160" height="50" rx="18" fill="#E2E8F0" filter="url(#s)"/>
  <text x="420" y="391" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Reset</text>  <rect x="640" y="140" width="480" height="340" rx="18" fill="#FFFFFF" filter="url(#s)"/>  <text x="880" y="180" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F766E">Screenshot SoM</text>  <rect x="700" y="220" width="360" height="50" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="880" y="251" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Username  [1]</text>  <rect x="700" y="290" width="360" height="50" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="880" y="321" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Password  [2]</text>  <rect x="700" y="360" width="160" height="50" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="780" y="391" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">Submit [3]</text>  <rect x="900" y="360" width="160" height="50" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="980" y="391" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">Reset [4]</text>  <text x="600" y="540" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#0F172A">Prompt : « clique [1], tape alice, clique [3] »</text>
</svg>
