<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Boucle coding agent</title>
  <desc id="d">SEARCH → EDIT → RUN → OBSERVE en boucle jusqu'aux tests verts. L'ACI définit comment l'agent perçoit et modifie le dépôt.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Coding agent : boucle edit / search / run</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">ACI — l'agent est un utilisateur du dépôt</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 21 · agentic-ai</text>  <rect x="60" y="240" width="200" height="120" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="160" y="296" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">SEARCH</text>
  <text x="160" y="318" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">trouver le code</text>  <rect x="340" y="240" width="200" height="120" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="440" y="296" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">EDIT</text>
  <text x="440" y="318" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">patch minimal</text>  <rect x="620" y="240" width="200" height="120" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="720" y="296" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">RUN</text>
  <text x="720" y="318" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">tests / CLI</text>  <rect x="900" y="240" width="200" height="120" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="1000" y="296" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">OBSERVE</text>
  <text x="1000" y="318" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">logs, diffs</text>  <line x1="260" y1="300" x2="340" y2="300" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="540" y1="300" x2="620" y2="300" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="820" y1="300" x2="900" y2="300" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <path d="M1040 360 Q1040 480 160 480 Q100 480 100 360" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <text x="600" y="520" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#0F766E">boucle jusqu'aux tests verts (ou abandon)</text>  <text x="600" y="580" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">SWE-bench mesure cette boucle sur de vrais issues GitHub</text>
</svg>
