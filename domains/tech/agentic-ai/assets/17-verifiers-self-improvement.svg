<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Boucle verifier</title>
  <desc id="d">Generate N candidats, verifier (PRM/règles), select best-of-N, persist les leçons pour s'améliorer entre les runs.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Verifiers &amp; self-improvement</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Générer N · scorer · garder le meilleur · persister les leçons</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 17 · agentic-ai</text>  <rect x="100" y="220" width="200" height="100" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="200" y="266" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Generate N</text>
  <text x="200" y="288" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">candidats</text>  <line x1="300" y1="270" x2="360" y2="270" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="360" y="220" width="200" height="100" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="460" y="266" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">Verifier</text>
  <text x="460" y="288" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">PRM / règles</text>  <line x1="560" y1="270" x2="620" y2="270" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="620" y="220" width="200" height="100" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="720" y="266" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Select</text>
  <text x="720" y="288" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">best-of-N</text>  <line x1="820" y1="270" x2="880" y2="270" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="880" y="220" width="200" height="100" rx="18" fill="#0F766E" filter="url(#s)"/>
  <text x="980" y="266" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#fff">Persist</text>
  <text x="980" y="288" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">leçons</text>  <rect x="200" y="400" width="800" height="160" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="600" y="460" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Outcome reward = résultat final · Process reward = qualité des étapes</text>
  <text x="600" y="510" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Sans persistance, l'agent réapprend les mêmes erreurs</text>
</svg>
