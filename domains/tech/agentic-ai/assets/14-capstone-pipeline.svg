  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Capstone : pipeline de production</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Guardrails → budget → supervisor + workers → HITL → rapport</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 14 · schéma détaillé</text>  <text x="600" y="108" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">tracing · cost budget · eval hooks</text>  <rect x="80" y="120" width="260" height="70" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="210" y="151" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">INPUT GUARDRAIL</text>
  <text x="210" y="173" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">injection · PII</text>  <rect x="80" y="210" width="260" height="70" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="210" y="241" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">RATE LIMIT</text>
  <text x="210" y="263" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">quotas / user</text>  <rect x="80" y="300" width="260" height="70" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="210" y="331" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">BUDGET</text>
  <text x="210" y="353" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">tokens · coût max</text>  <line x1="210" y1="190" x2="210" y2="208" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="210" y1="280" x2="210" y2="298" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="340" y1="335" x2="430" y2="335" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="440" y="280" width="320" height="90" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="600" y="321" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">SUPERVISOR</text>
  <text x="600" y="343" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">délégué + synthèse</text>  <text x="780" y="270" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">fan-out</text>  <path d="M600 370 L600 385 L340 385 L340 400" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>
  <path d="M600 370 L600 400" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>
  <path d="M600 370 L600 385 L860 385 L860 400" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="250" y="405" width="180" height="64" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="340" y="433" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">RESEARCHER</text>
  <text x="340" y="455" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">RAG</text>  <rect x="510" y="405" width="180" height="64" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="600" y="433" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">ANALYZER</text>
  <text x="600" y="455" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">raisonne</text>  <rect x="770" y="405" width="180" height="64" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="860" y="433" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">WRITER</text>
  <text x="860" y="455" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">rédige</text>  <path d="M950 437 Q1040 437 1040 325 Q1040 280 760 280" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrA)"/>
  <text x="1060" y="365" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#F59E0B">synthèse</text>  <line x1="600" y1="469" x2="600" y2="500" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="440" y="505" width="320" height="52" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="600" y="527" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">OUTPUT GUARDRAIL</text>
  <text x="600" y="549" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">schema · filtre</text>  <path d="M600 557 L600 570 L450 570 L450 585" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>
  <path d="M600 557 L600 570 L750 570 L750 585" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="350" y="590" width="200" height="48" rx="18" fill="#FEE2E2" filter="url(#s)"/>
  <text x="450" y="610" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#991B1B">HITL GATE</text>
  <text x="450" y="632" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">approval</text>  <rect x="650" y="590" width="200" height="48" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="750" y="620" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">FINAL REPORT</text>
