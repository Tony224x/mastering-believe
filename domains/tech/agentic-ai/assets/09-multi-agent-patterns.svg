<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Patterns multi-agent</title>
  <desc id="d">Quatre archétypes : Supervisor (chef + workers), Swarm (handoffs), Hiérarchie, Débat (critique croisée). Commencer single-agent.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">4 patterns multi-agent</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Supervisor · Swarm · Hiérarchie · Débat</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 09 · agentic-ai</text>  <rect x="80" y="180" width="240" height="300" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <rect x="150" y="220" width="100" height="100" rx="50" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="200" y="278" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F766E">SUP</text>
  <text x="200" y="360" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">Supervisor</text>  <text x="200" y="400" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Chef délègue</text>  <text x="200" y="426" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">aux workers</text>  <rect x="340" y="180" width="240" height="300" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <rect x="410" y="220" width="100" height="100" rx="50" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="460" y="278" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F766E">SWA</text>
  <text x="460" y="360" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">Swarm</text>  <text x="460" y="400" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Handoff peer</text>  <text x="460" y="426" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">à peer</text>  <rect x="600" y="180" width="240" height="300" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <rect x="670" y="220" width="100" height="100" rx="50" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="720" y="278" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F766E">HIÉ</text>
  <text x="720" y="360" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">Hiérarchie</text>  <text x="720" y="400" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Niveaux de</text>  <text x="720" y="426" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">supervision</text>  <rect x="860" y="180" width="240" height="300" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <rect x="930" y="220" width="100" height="100" rx="50" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
  <text x="980" y="278" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0F766E">DÉB</text>
  <text x="980" y="360" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">Débat</text>  <text x="980" y="400" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Critique</text>  <text x="980" y="426" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">croisée</text>  <text x="600" y="560" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">Commence single-agent. Multi seulement si rôles distincts.</text>
</svg>
