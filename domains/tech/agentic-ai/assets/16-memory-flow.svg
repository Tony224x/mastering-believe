<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Flux mémoire agent long-horizon</title>
  <desc id="d">Pipeline événement, scoring, stockage, retrieval et injection dans le contexte.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Flux mémoire d'un agent long-horizon</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Événement → score → store → injection</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 16 · schéma détaillé</text>  <rect x="104" y="230" width="160" height="100" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="184" y="276" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Événement</text>
  <text x="184" y="298" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">tool / user msg</text>  <line x1="264" y1="280" x2="312" y2="280" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="312" y="230" width="160" height="100" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="392" y="276" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">Score</text>
  <text x="392" y="298" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">récence · import.</text>  <line x1="472" y1="280" x2="520" y2="280" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="520" y="230" width="160" height="100" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="600" y="276" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Store</text>
  <text x="600" y="298" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">episodic / sém.</text>  <line x1="680" y1="280" x2="728" y2="280" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="728" y="230" width="160" height="100" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="808" y="276" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">Retrieve</text>
  <text x="808" y="298" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">top-k pertinent</text>  <line x1="888" y1="280" x2="936" y2="280" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="936" y="230" width="160" height="100" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="1016" y="276" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Inject</text>
  <text x="1016" y="298" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">dans le prompt</text>  <rect x="150" y="380" width="900" height="120" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="600" y="430" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#0F172A">Consolidation : observations → faits stables</text>
  <text x="600" y="465" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">Decay : oublier le bruit pour rester pertinent</text>
</svg>
