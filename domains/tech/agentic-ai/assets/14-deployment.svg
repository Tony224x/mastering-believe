  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 14 · schéma détaillé</text>  <rect x="250" y="150" width="700" height="80" rx="18" fill="#FFFFFF" filter="url(#s)"/>
