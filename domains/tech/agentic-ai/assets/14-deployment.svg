  <text x="600" y="408" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">supervisor + workers</text>  <rect x="250" y="450" width="700" height="80" rx="18" fill="#FFFFFF" filter="url(#s)"/>
