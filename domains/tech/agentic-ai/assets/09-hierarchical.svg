  <text x="600" y="160" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">objectif global</text>  <path d="M600 174 L600 200 L340 200 L340 220" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>
