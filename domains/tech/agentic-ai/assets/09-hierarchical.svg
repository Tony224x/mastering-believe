  <text x="425" y="385" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">fichiers · RAG</text>  <rect x="700" y="335" width="150" height="64" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="775" y="363" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Code</text>
  <text x="775" y="385" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">impl · tests</text>  <rect x="870" y="335" width="150" height="64" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="945" y="363" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Review</text>
  <text x="945" y="385" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">critique · QA</text>  <text x="600" y="460" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">Chaque niveau synthétise avant de remonter</text>  <rect x="200" y="490" width="800" height="90" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="600" y="530" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">Org en couches (équipe → pôle → direction)</text>
  <text x="600" y="558" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">Coût ↗ avec la profondeur — borner les niveaux</text>
