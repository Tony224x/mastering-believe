  <text x="255" y="385" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">web · papers</text>  <rect x="350" y="335" width="150" height="64" rx="18" fill="#FFFFFF" filter="url(#s)"/>
