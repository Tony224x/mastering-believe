  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Supervisors de supervisors — plusieurs niveaux de délégation</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 09 · schéma détaillé</text>  <rect x="450" y="110" width="300" height="64" rx="18" fill="#CCFBF1" filter="url(#s)"/>
