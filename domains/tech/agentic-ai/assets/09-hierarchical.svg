  <text x="860" y="275" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">domaine B</text>  <line x1="255" y1="289" x2="255" y2="330" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="425" y1="289" x2="425" y2="330" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="775" y1="289" x2="775" y2="330" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="945" y1="289" x2="945" y2="330" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="180" y="335" width="150" height="64" rx="18" fill="#FFFFFF" filter="url(#s)"/>
