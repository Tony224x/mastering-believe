<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Architecture research agent</title>
  <desc id="d">Pipeline START, planner, executor avec replan, analyzer, synthesizer, END. State partagé et outils de recherche.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Research agent : architecture</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Planner → executor (boucle) → analyzer → synthesizer</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 07 · schéma détaillé</text>  <rect x="80" y="200" width="140" height="80" rx="18" fill="#E2E8F0" filter="url(#s)"/>
  <text x="150" y="246" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">START</text>  <line x1="220" y1="240" x2="260" y2="240" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="260" y="180" width="180" height="120" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="350" y="236" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">PLANNER</text>
  <text x="350" y="258" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">list[str] steps</text>  <line x1="440" y1="240" x2="490" y2="240" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="490" y="180" width="200" height="120" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="590" y="236" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">EXECUTOR</text>
  <text x="590" y="258" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">tool + scratchpad</text>  <line x1="690" y1="240" x2="740" y2="240" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="740" y="180" width="180" height="120" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="830" y="236" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">ANALYZER</text>
  <text x="830" y="258" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">faits · check</text>  <line x1="920" y1="240" x2="960" y2="240" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="960" y="200" width="140" height="80" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="1030" y="236" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">END</text>
  <text x="1030" y="258" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">answer</text>  <path d="M590 300 Q590 380 350 380 Q280 380 280 300" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrA)"/>
  <text x="430" y="405" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#F59E0B">replan si bloqué</text>  <rect x="120" y="440" width="960" height="160" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="600" y="480" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">State partagé</text>
  <text x="600" y="515" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">question · plan · short_term · long_term · findings · final_answer</text>
  <text x="600" y="555" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Tools : mock_web_search · read_doc · summarize</text>
  <text x="600" y="580" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0F766E">Patterns J4 (plan-and-execute) + J5 (LangGraph nodes)</text>
</svg>
