<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Hybrid memory summary plus fenêtre</title>
  <desc id="d">Résumé des anciens messages à gauche, fenêtre récente à droite, assemblés pour le LLM.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Hybrid memory</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Summary des vieux tours + fenêtre récente</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 03 · schéma détaillé</text>  <rect x="80" y="140" width="1040" height="360" rx="18" fill="#FFFFFF" filter="url(#s)"/>  <rect x="120" y="180" width="420" height="120" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="330" y="236" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">Summary messages 1–N</text>
  <text x="330" y="258" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">compressé · bas coût</text>  <rect x="660" y="180" width="420" height="120" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="870" y="236" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Recent window</text>
  <text x="870" y="258" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">verbatim · haute fidélité</text>  <line x1="600" y1="320" x2="600" y2="360" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="350" y="370" width="500" height="70" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="600" y="411" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Prompt assemblé → LLM</text>  <text x="600" y="500" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#0F172A">Summary avant le plafond de tokens</text>
</svg>
