<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Capstone multi-agent</title>
  <desc id="d">Supervisor au centre qui délègue à Researcher, Analyst, Critic et Writer ; livrable avec traces, tests et garde-fous.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Capstone S1-S2 : assistant recherche multi-agent</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Supervisor + workers + eval + observabilité</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 14 · agentic-ai</text>  <rect x="480" y="140" width="240" height="80" rx="18" fill="#0F766E" filter="url(#s)"/>
  <text x="600" y="176" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#fff">Supervisor</text>
  <text x="600" y="198" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">orchestre</text>  <rect x="100" y="300" width="200" height="90" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="200" y="341" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Researcher</text>
  <text x="200" y="363" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">web / docs</text>  <rect x="360" y="300" width="200" height="90" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="460" y="341" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">Analyst</text>
  <text x="460" y="363" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">synthèse</text>  <rect x="620" y="300" width="200" height="90" rx="18" fill="#DBEAFE" filter="url(#s)"/>
  <text x="720" y="341" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#1E3A8A">Critic</text>
  <text x="720" y="363" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">qualité</text>  <rect x="880" y="300" width="200" height="90" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="980" y="341" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Writer</text>
  <text x="980" y="363" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">livrable</text>  <path d="M600 220 L200 300" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#arrT)"/>  <path d="M600 220 L460 300" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#arrT)"/>  <path d="M600 220 L720 300" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#arrT)"/>  <path d="M600 220 L980 300" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#arrT)"/>  <rect x="200" y="450" width="800" height="140" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="600" y="505" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Livrable : runnable + traces + tests de trajectoire + garde-fous</text>
  <text x="600" y="545" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Pas un démo happy-path : erreurs, timeouts, et cas ambigus doivent être gérés</text>
</svg>
