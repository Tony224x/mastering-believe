<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Pattern débat multi-agent</title>
  <desc id="d">Agents A B C s'échangent critiques sur plusieurs rounds, puis un merge/judge produit la réponse.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Pattern débat collaboratif</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Plusieurs agents critiquent, un merger consolide</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 09 · schéma détaillé</text>  <rect x="200" y="160" width="220" height="90" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="310" y="201" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Agent A</text>
  <text x="310" y="223" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">proposition</text>  <line x1="420" y1="205" x2="470" y2="205" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="470" y="160" width="220" height="90" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="580" y="201" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">Agent B</text>
  <text x="580" y="223" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">critique A</text>  <line x1="690" y1="205" x2="740" y2="205" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="740" y="160" width="220" height="90" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="850" y="201" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Agent C</text>
  <text x="850" y="223" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">critique B</text>  <text x="310" y="275" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">round 1</text>  <text x="580" y="275" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">round 2</text>  <text x="850" y="275" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">round 3</text>  <line x1="600" y1="290" x2="600" y2="330" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="420" y="340" width="360" height="80" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="600" y="376" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">MERGE / JUDGE</text>
  <text x="600" y="398" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">liste consolidée</text>  <line x1="600" y1="420" x2="600" y2="460" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="460" y="470" width="280" height="60" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="600" y="496" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">ANSWER</text>
  <text x="600" y="518" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">synthèse finale</text>  <text x="600" y="580" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#0F172A">Borner les rounds — éviter coût et boucles</text>
</svg>
