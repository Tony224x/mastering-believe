<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Boucle Perceive Think Act</title>
  <desc id="d">Trois étapes en boucle : Perceive (observations), Think (raisonnement), Act (outil ou réponse finale), jusqu'à l'objectif.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Boucle fondamentale d'un agent</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Perceive → Think → Act — le LLM pilote le flux</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 01 · agentic-ai</text>  <rect x="120" y="160" width="240" height="120" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="240" y="216" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">PERCEIVE</text>
  <text x="240" y="238" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">observations, outils</text>  <rect x="480" y="160" width="240" height="120" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="600" y="216" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">THINK</text>
  <text x="600" y="238" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">raisonne, planifie</text>  <rect x="840" y="160" width="240" height="120" rx="18" fill="#DBEAFE" filter="url(#s)"/>
  <text x="960" y="216" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#1E3A8A">ACT</text>
  <text x="960" y="238" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">outil ou réponse</text>  <line x1="360" y1="220" x2="470" y2="220" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="720" y1="220" x2="830" y2="220" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <path d="M960 280 Q960 420 600 420 Q240 420 240 280" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>
  <text x="600" y="450" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0F766E">boucle jusqu'à l'objectif</text>  <rect x="200" y="500" width="800" height="100" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="600" y="545" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#0F172A">Pipeline = chemin fixe · Agent = chemin dynamique</text>
  <text x="600" y="575" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Debugger = repérer où la boucle déraille</text>
</svg>
