  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">États d'une tâche inter-agents</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 19 · schéma détaillé</text>  <rect x="100" y="260" width="170" height="80" rx="18" fill="#E2E8F0" filter="url(#s)"/>
