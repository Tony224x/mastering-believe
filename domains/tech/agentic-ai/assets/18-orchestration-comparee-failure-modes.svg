  <title id="t">Frameworks d'orchestration</title>
  <desc id="d">Cinq familles : LangGraph, CrewAI, AutoGen, OpenAI Agents SDK, Swarm/ADK — trade-offs contrôle vs vitesse ; failure modes multi-agent.</desc>
  <defs>
