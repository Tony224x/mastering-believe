  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Trois leviers d'inference engineering</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Routing · structured outputs · caching</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 24 · schéma détaillé</text>  <rect x="450" y="120" width="300" height="56" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="600" y="154" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">Requête user</text>  <line x1="600" y1="176" x2="600" y2="215" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="400" y="225" width="400" height="70" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="600" y="256" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">ModelRouter</text>
  <text x="600" y="278" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">weak si simple · strong si dur</text>  <line x1="600" y1="295" x2="600" y2="340" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="140" y="350" width="280" height="90" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="280" y="391" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Structured out</text>
  <text x="280" y="413" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">schema / tools fiables</text>  <rect x="460" y="350" width="280" height="90" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="600" y="391" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">Prompt cache</text>
  <text x="600" y="413" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">préfixe réutilisé</text>  <rect x="780" y="350" width="280" height="90" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="920" y="391" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Réponse</text>
  <text x="920" y="413" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">latence ↓ coût ↓</text>  <text x="600" y="500" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#0F172A">Router → format contraint → cache du stable</text>
