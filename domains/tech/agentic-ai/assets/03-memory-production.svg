<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Architecture mémoire production</title>
  <desc id="d">Dans la boucle : context window, working memory, LLM, tools et checkpoint. En dehors : vector store et key-value pour le long terme.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Mémoire d'un agent en production</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Boucle agent + 3 mémoires + stores externes</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 03 · schéma détaillé</text>  <rect x="80" y="120" width="1040" height="380" rx="18" fill="#FFFFFF" filter="url(#s)"/>  <text x="100" y="155" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0F766E">AGENT LOOP</text>  <rect x="120" y="180" width="280" height="130" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="260" y="241" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Context window</text>
  <text x="260" y="263" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">system · summary · msgs</text>  <rect x="440" y="180" width="280" height="130" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="580" y="241" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">Working memory</text>
  <text x="580" y="263" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">task · step · findings</text>  <rect x="760" y="200" width="280" height="90" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="900" y="241" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">LLM</text>
  <text x="900" y="263" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">décide next action</text>  <line x1="400" y1="245" x2="430" y2="245" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="720" y1="245" x2="750" y2="245" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="200" y="360" width="300" height="80" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="350" y="396" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Tool execution</text>
  <text x="350" y="418" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">APIs · fichiers</text>  <rect x="600" y="360" width="300" height="80" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="750" y="396" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Checkpoint</text>
  <text x="750" y="418" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">save state / resume</text>  <line x1="900" y1="290" x2="900" y2="360" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="600" y1="500" x2="600" y2="530" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="200" y="540" width="320" height="80" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="360" y="576" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">Vector store</text>
  <text x="360" y="598" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">long-term sémantique</text>  <rect x="680" y="540" width="320" height="80" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="840" y="576" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Key-value store</text>
  <text x="840" y="598" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">prefs · faits stables</text>  <text x="600" y="655" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">Short-term dans le prompt · Working hors prompt · Long-term en store</text>
</svg>
