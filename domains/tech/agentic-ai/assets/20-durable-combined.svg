<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Architecture durable event-driven HITL</title>
  <desc id="d">Workflow durable avec activities LLM et tools, attente signal HITL, alimenté par un bus d'événements.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Durable + event-driven + HITL</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Architecture combinée pour longs runs</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 20 · schéma détaillé</text>  <rect x="80" y="130" width="680" height="400" rx="18" fill="#FFFFFF" filter="url(#s)"/>  <text x="100" y="170" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0F766E">Workflow durable (Temporal…)</text>  <rect x="120" y="200" width="280" height="56" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="260" y="234" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Activity: LLM plan</text>  <rect x="120" y="275" width="280" height="56" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="260" y="309" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">Activity: tools</text>  <rect x="120" y="350" width="280" height="56" rx="18" fill="#FEE2E2" filter="url(#s)"/>
  <text x="260" y="384" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#991B1B">Wait signal HITL</text>  <rect x="120" y="425" width="280" height="56" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="260" y="459" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Activity: finalize</text>  <rect x="820" y="160" width="280" height="340" rx="18" fill="#FFFFFF" filter="url(#s)"/>  <text x="960" y="200" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0F172A">Event bus</text>  <rect x="850" y="230" width="220" height="50" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="960" y="261" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">user.reply</text>  <rect x="850" y="300" width="220" height="50" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="960" y="331" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">timer.fire</text>  <rect x="850" y="370" width="220" height="50" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="960" y="401" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">tool.done</text>  <text x="600" y="580" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Crash ≠ perte — reprise au signal</text>
</svg>
