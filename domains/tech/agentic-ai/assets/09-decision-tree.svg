<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Arbre décision single vs multi-agent</title>
  <desc id="d">Si tâche simple : single agent. Sinon, multi seulement si plusieurs rôles ou besoin de critique parallèle.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Single-agent ou multi-agent ?</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Arbre de décision pragmatique</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 09 · schéma détaillé</text>  <rect x="400" y="115" width="400" height="64" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="600" y="143" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">Tâche simple ?</text>
  <text x="600" y="165" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">&lt; 10 étapes · 1 compétence</text>  <line x1="600" y1="179" x2="600" y2="205" stroke="#0F766E" stroke-width="2.5"/>  <line x1="280" y1="205" x2="920" y2="205" stroke="#0F766E" stroke-width="2.5"/>  <line x1="280" y1="205" x2="280" y2="230" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="920" y1="205" x2="920" y2="230" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <text x="400" y="200" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0F766E">Oui</text>  <text x="750" y="200" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#DC2626">Non</text>  <rect x="140" y="240" width="280" height="80" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="280" y="276" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Single agent</text>
  <text x="280" y="298" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">tools + bon prompt</text>  <rect x="760" y="240" width="320" height="80" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="920" y="276" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Plusieurs rôles ?</text>
  <text x="920" y="298" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">parallèle / critique</text>  <line x1="920" y1="320" x2="920" y2="348" stroke="#0F766E" stroke-width="2.5"/>  <line x1="560" y1="348" x2="1000" y2="348" stroke="#0F766E" stroke-width="2.5"/>  <line x1="560" y1="348" x2="560" y2="375" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="1000" y1="348" x2="1000" y2="375" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <text x="640" y="343" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0F766E">Oui</text>  <text x="1020" y="343" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#DC2626">Non</text>  <rect x="420" y="385" width="280" height="70" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="560" y="416" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">Multi-agent</text>
  <text x="560" y="438" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">supervisor d'abord</text>  <rect x="860" y="385" width="280" height="70" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="1000" y="416" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Single + tools</text>
  <text x="1000" y="438" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">plus simple, cheap</text>  <text x="600" y="520" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#0F172A">Commence single ; multi si rôles distincts</text>
</svg>
