<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Pipeline RAG agentique</title>
  <desc id="d">Flux : query, décomposition, routing multi-sources, grading, reformulation, multi-hop, synthèse de la réponse finale.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Pipeline RAG agentique complet</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Decomposer → router → sources → grader → multi-hop → synthèse</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 08 · schéma détaillé</text>  <rect x="420" y="100" width="360" height="48" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="600" y="130" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">USER QUERY</text>  <path d="M600 148 L600 165 L435 165 L435 180" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="305" y="180" width="260" height="56" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="435" y="204" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">DECOMPOSER</text>
  <text x="435" y="226" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">→ sub-queries</text>  <rect x="635" y="180" width="260" height="56" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="765" y="204" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">ROUTER</text>
  <text x="765" y="226" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">source par sub-q</text>  <line x1="565" y1="208" x2="625" y2="208" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <path d="M765 236 L765 255 L370 255 L370 270" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>
  <path d="M765 236 L765 255 L600 255 L600 270" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>
  <path d="M765 236 L765 255 L830 255 L830 270" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <text x="600" y="252" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748B">retrieve parallèle</text>  <rect x="280" y="275" width="180" height="48" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="370" y="305" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">source 1</text>  <rect x="510" y="275" width="180" height="48" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="600" y="305" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">source 2</text>  <rect x="740" y="275" width="180" height="48" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="830" y="305" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">source 3</text>  <path d="M370 323 L370 340 L600 340 L600 355" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>
  <path d="M600 323 L600 355" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>
  <path d="M830 323 L830 340 L600 340 L600 355" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="420" y="360" width="360" height="50" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="600" y="381" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">GRADER</text>
  <text x="600" y="403" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">garde le pertinent</text>  <path d="M600 410 L600 425 L320 425 L320 440" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>
  <path d="M600 410 L600 425 L600 440" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>
  <path d="M600 410 L600 425 L880 425 L880 440" fill="none" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="200" y="445" width="240" height="60" rx="18" fill="#FEE2E2" filter="url(#s)"/>
  <text x="320" y="471" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#991B1B">REFORMULATE</text>
  <text x="320" y="493" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">retry ≤ 3</text>  <rect x="480" y="445" width="240" height="60" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="600" y="471" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">NEXT HOP</text>
  <text x="600" y="493" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">multi-hop loop</text>  <rect x="760" y="445" width="240" height="60" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="880" y="471" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">SYNTHESIZER</text>
  <text x="880" y="493" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">→ answer</text>  <path d="M200 475 L90 475 L90 208 L635 208" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrA)"/>
  <text x="105" y="350" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#DC2626" transform="rotate(-90 105 350)">docs faibles</text>  <text x="320" y="530" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">loop → router</text>  <text x="600" y="530" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">oui → nouvelle sub-q</text>  <text x="880" y="530" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">sinon → answer</text>  <text x="600" y="580" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#0F172A">2–4 hops max · chaque hop = latence + coût</text>
</svg>
