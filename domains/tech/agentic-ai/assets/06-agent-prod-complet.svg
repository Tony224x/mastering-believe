<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Patterns LangGraph combinés production</title>
  <desc id="d">Main graph avec router, subgraph workers en parallèle, merge, HITL, le tout sur checkpointer.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Agent production LangGraph</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Subgraphs + parallèle + checkpointer + HITL</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 06 · schéma détaillé</text>  <text x="600" y="115" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0F766E">MAIN GRAPH</text>  <rect x="80" y="200" width="110" height="88" rx="18" fill="#E2E8F0" filter="url(#s)"/>
  <text x="135" y="250" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">START</text>  <rect x="230" y="200" width="160" height="88" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="310" y="240" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Router</text>
  <text x="310" y="262" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">route intent</text>  <rect x="430" y="200" width="200" height="88" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="530" y="240" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">Subgraph workers</text>
  <text x="530" y="262" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">parallel Send</text>  <rect x="670" y="200" width="140" height="88" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="740" y="240" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Merge</text>
  <text x="740" y="262" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">fan-in</text>  <rect x="850" y="200" width="160" height="88" rx="18" fill="#FEE2E2" filter="url(#s)"/>
  <text x="930" y="240" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#991B1B">HITL</text>
  <text x="930" y="262" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">approval</text>  <rect x="1050" y="200" width="110" height="88" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="1105" y="240" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">END</text>
  <text x="1105" y="262" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">réponse</text>  <line x1="190" y1="244" x2="220" y2="244" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="390" y1="244" x2="420" y2="244" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="630" y1="244" x2="660" y2="244" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="810" y1="244" x2="840" y2="244" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <line x1="1010" y1="244" x2="1040" y2="244" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="80" y="360" width="1040" height="120" rx="18" fill="#CCFBF1" filter="url(#s)"/>  <text x="600" y="405" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#115E59">Checkpointer</text>  <text x="600" y="438" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">thread_id · resume · time-travel</text>  <text x="600" y="520" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#DC2626">crash sans persistence = tout perdre</text>  <text x="600" y="560" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Persistence sous tout le graphe — reprise après interrupt HITL</text>
</svg>
