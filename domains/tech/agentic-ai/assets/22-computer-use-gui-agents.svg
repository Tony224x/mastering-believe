<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">GUI agent loop</title>
  <desc id="d">Screenshot (perception) → grounding (set-of-marks, coordonnées) → action (click/type/scroll). Grounding fragile, sandbox obligatoire.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">GUI / computer-use agents</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Perception visuelle → grounding → action souris/clavier</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 22 · agentic-ai</text>  <rect x="100" y="220" width="240" height="140" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="220" y="286" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Screenshot</text>
  <text x="220" y="308" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">pixels / DOM</text>  <line x1="340" y1="290" x2="400" y2="290" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="400" y="220" width="280" height="140" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="540" y="286" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">Grounding</text>
  <text x="540" y="308" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">set-of-marks, coords</text>  <line x1="680" y1="290" x2="740" y2="290" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="740" y="220" width="340" height="140" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="910" y="286" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Action</text>
  <text x="910" y="308" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">click, type, scroll</text>  <rect x="200" y="430" width="800" height="140" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="600" y="490" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">Fragilité : un pixel de décalage = clic raté</text>
  <text x="600" y="530" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">Claude computer use · OpenAI CUA · browser-use — toujours sandboxer</text>
</svg>
