<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Pattern Plan-and-Execute</title>
  <desc id="d">Question, planner qui produit des étapes, executor outillé, réponse ; boucle de replan si besoin.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Plan-and-Execute</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Planifier d'abord, exécuter ensuite</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 04 · schéma détaillé</text>  <rect x="100" y="200" width="180" height="100" rx="18" fill="#FEF3C7" filter="url(#s)"/>
  <text x="190" y="246" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#92400E">Question</text>
  <text x="190" y="268" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">user goal</text>  <line x1="280" y1="250" x2="325" y2="250" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="325" y="180" width="220" height="140" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="435" y="246" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">PLANNER</text>
  <text x="435" y="268" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">liste d'étapes</text>  <line x1="545" y1="250" x2="590" y2="250" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="590" y="180" width="220" height="140" rx="18" fill="#FFFFFF" filter="url(#s)"/>
  <text x="700" y="246" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0F172A">EXECUTOR</text>
  <text x="700" y="268" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">tools step by step</text>  <line x1="810" y1="250" x2="855" y2="250" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="855" y="200" width="180" height="100" rx="18" fill="#CCFBF1" filter="url(#s)"/>
  <text x="945" y="246" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#115E59">Answer</text>
  <text x="945" y="268" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748B">synthèse</text>  <path d="M700 320 Q700 400 435 400 Q380 400 380 320" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrA)"/>
  <text x="560" y="430" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#F59E0B">replan si étape échoue</text>  <text x="600" y="500" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#0F172A">Moins de tokens que ReAct sur tâches longues</text>
</svg>
