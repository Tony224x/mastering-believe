<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"
     role="img" aria-labelledby="t d">
  <title id="t">Pipeline d'évaluation</title>
  <desc id="d">Quatre étages : tests dev, regression CI, eval nightly large, monitoring production sur le traffic réel.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#F8FAFC"/>
  <rect x="0" y="0" width="8" height="680" fill="url(#gHead)"/>
  <text x="56" y="48" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0F172A">Pipeline d'évaluation bout en bout</text>
  <text x="56" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748B">Dev → CI → Nightly → Prod online</text>
  <text x="56" y="660" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#64748B">Module 11 · schéma détaillé</text>  <rect x="100" y="200" width="240" height="280" rx="18" fill="#CCFBF1" filter="url(#s)"/>  <text x="220" y="280" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">1 · DEV</text>  <text x="220" y="340" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">unit tests</text>  <text x="220" y="368" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">rapides, déterministes</text>  <line x1="340" y1="340" x2="380" y2="340" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="380" y="200" width="240" height="280" rx="18" fill="#FFFFFF" filter="url(#s)"/>  <text x="500" y="280" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">2 · CI</text>  <text x="500" y="340" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">20–50 cas / PR</text>  <text x="500" y="368" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">bloque si fail</text>  <line x1="620" y1="340" x2="660" y2="340" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="660" y="200" width="240" height="280" rx="18" fill="#FEF3C7" filter="url(#s)"/>  <text x="780" y="280" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">3 · NIGHTLY</text>  <text x="780" y="340" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">200–500 cas</text>  <text x="780" y="368" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">rapport qualité</text>  <line x1="900" y1="340" x2="940" y2="340" stroke="#0F766E" stroke-width="2.5" marker-end="url(#arrT)"/>  <rect x="940" y="200" width="240" height="280" rx="18" fill="#FEE2E2" filter="url(#s)"/>  <text x="1060" y="280" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0F172A">4 · PROD</text>  <text x="1060" y="340" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">tracing + scoring</text>  <text x="1060" y="368" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748B">traffic réel</text>  <text x="600" y="560" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0F172A">Niveaux 1–2 = déterministes · Niveau 4 = live (LLM-as-judge possible)</text>
</svg>
